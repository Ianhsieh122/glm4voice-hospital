version: '3.8'

services:
  opus-hospital-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opus-hospital-backend
    restart: unless-stopped
    
    # GPU 支持
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # 環境變量
    environment:
      - OPUS_ENV=production
      - CONFIG_PATH=config.production.yaml
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
    
    # 端口映射
    ports:
      - "8000:8000"
      - "9090:9090"  # Prometheus metrics
    
    # 卷掛載
    volumes:
      - ./config.production.yaml:/app/config.production.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models  # 預下載的模型
      - model-cache:/root/.cache/huggingface  # HF 緩存
    
    # 網絡
    networks:
      - opus-network
    
    # 健康檢查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # 日誌配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: opus-hospital-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    
    networks:
      - opus-network
    
    depends_on:
      opus-hospital-backend:
        condition: service_healthy
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Prometheus 監控 (可選)
  prometheus:
    image: prom/prometheus:latest
    container_name: opus-hospital-prometheus
    restart: unless-stopped
    
    ports:
      - "9091:9090"
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    networks:
      - opus-network
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Grafana 可視化 (可選)
  grafana:
    image: grafana/grafana:latest
    container_name: opus-hospital-grafana
    restart: unless-stopped
    
    ports:
      - "3001:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
    
    networks:
      - opus-network
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  opus-network:
    driver: bridge

volumes:
  model-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

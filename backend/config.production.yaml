# Opus Hospital - Production Configuration

# GPU Settings (NVIDIA Production)
gpu:
  device: "cuda:0"
  precision: "fp16"
  batch_size: 64
  
  # Individual device settings for each model (PRODUCTION)
  stt_device: "cuda:0"  # STT on GPU
  llm_device: "cuda:0"  # LLM on GPU (production uses GPU)
  tts_device: "cuda:0"  # TTS on GPU

# AI Models (Production-grade)
models:
  stt: "openai/whisper-large-v3-turbo"
  llm: "Qwen/Qwen2.5-3B-Instruct"
  tts: "F5-TTS"
  tts_model_name: "F5-TTS"  # or "DiaMoE-TTS" for better dialect support

# vLLM Settings (High concurrency for production)
vllm:
  enabled: true
  max_model_len: 2048
  max_num_batched_tokens: 8192
  max_num_seqs: 256
  gpu_memory_utilization: 0.85  # Leave some room for STT/TTS
  dtype: "half"
  trust_remote_code: true
  disable_log_requests: false
  
# LLM Generation Settings
llm_generation:
  max_tokens: 150
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
  do_sample: true
  use_beam_search: false
  enable_chunked_prefill: true

# Audio Processing
audio:
  sample_rate: 16000
  channels: 1
  format: "pcm16"
  chunk_size: 4096
  vad_threshold: 0.5
  vad_frame_duration: 30

# Server Configuration (Production)
server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 4
  log_level: "info"
  max_connections: 500
  
  # Security settings
  cors_origins:
    - "https://yourdomain.com"
    - "https://www.yourdomain.com"
  allowed_hosts:
    - "yourdomain.com"
    - "www.yourdomain.com"
  
  # SSL/TLS (uncomment for HTTPS)
  # ssl_keyfile: "/path/to/key.pem"
  # ssl_certfile: "/path/to/cert.pem"

# Session Management
session:
  max_history_length: 10
  session_timeout: 1800
  cleanup_interval: 300

# Database Settings
database:
  type: "sqlite"
  path: "data/patients.db"
  pool_size: 20
  
# Monitoring & Observability
monitoring:
  enable_prometheus: true
  prometheus_port: 9090
  enable_health_check: true
  health_check_interval: 60
  
# Rate Limiting (Production)
rate_limiting:
  enabled: true
  requests_per_minute: 60
  burst_size: 10

# Logging
logging:
  level: "INFO"
  format: "json"  # JSON for production log aggregation
  file: "logs/opus-hospital.log"
  max_size_mb: 100
  backup_count: 10
  
# Feature Flags
features:
  enable_voice_cloning: false
  enable_emotion_control: false
  enable_analytics: true
  enable_model_caching: true
